[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobileax"
version = "0.5.0"
description = "Pythonic bindings for the mobileAX Android control CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "mobileAX contributors" }]
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Operating System Kernels :: Linux",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/pbk20191/mobileax"
Documentation = "https://pbk20191.github.io/mobileax/"
Source = "https://github.com/pbk20191/mobileax/tree/main/bindings/python"

[tool.setuptools.packages.find]
where = ["src"]
