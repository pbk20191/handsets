[workspace]
resolver = "2"
members = ["mobax-core", "mobax-cli", "mobax-tui", "mobax-viewer"]
# A bare `cargo build` skips the viewer: it is the heavy one (GPU and codec
# bindings, libavcodec on Linux). Build it with `-p mobax-viewer` or
# `--workspace`.
default-members = ["mobax-cli", "mobax-tui"]

[workspace.package]
version = "0.4.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"          # drop unwind tables (~10–20% binary size)
strip = "symbols"
debug = false
overflow-checks = false

# Speed first: the viewer's JPEG decoders are the hot path, and opt-level "z"
# roughly doubles their decode time for ~26 KB less binary.
[profile.release.package.mobax-viewer]
opt-level = 3
